<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Connection lines (drawn first, behind nodes) -->
  <line x1="40" y1="38" x2="88" y2="38" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  <line x1="40" y1="38" x2="40" y2="90" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  <line x1="88" y1="38" x2="88" y2="90" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  <line x1="40" y1="90" x2="88" y2="90" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  <line x1="40" y1="38" x2="88" y2="90" stroke="#3b82f6" stroke-width="1" opacity="0.25"/>
  <line x1="88" y1="38" x2="40" y2="90" stroke="#3b82f6" stroke-width="1" opacity="0.25"/>
  <!-- Fleet nodes -->
  <circle cx="40" cy="38" r="10" fill="#3b82f6" opacity="0.9"/>
  <circle cx="88" cy="38" r="10" fill="#3b82f6" opacity="0.9"/>
  <circle cx="40" cy="90" r="10" fill="#3b82f6" opacity="0.9"/>
  <circle cx="88" cy="90" r="10" fill="#3b82f6" opacity="0.9"/>
  <!-- Inner dots (active indicator) -->
  <circle cx="40" cy="38" r="4" fill="#93c5fd"/>
  <circle cx="88" cy="38" r="4" fill="#93c5fd"/>
  <circle cx="40" cy="90" r="4" fill="#93c5fd"/>
  <circle cx="88" cy="90" r="4" fill="#93c5fd"/>
  <!-- Label -->
  <text x="64" y="118" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="sans-serif" font-weight="bold">MULTI-FLEET</text>
</svg>
