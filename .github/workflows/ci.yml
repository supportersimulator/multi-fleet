name: CI

on:
  push:
    branches: [main]
    paths:
      - 'multifleet/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'ruff.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'multifleet/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'ruff.toml'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: .

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install nats-py
          # Install from pyproject.toml if it exists
          if [ -f pyproject.toml ]; then
            pip install -e .
          fi

      - name: Run unit tests
        run: |
          python -m pytest tests/ -m "not integration" -v --tb=short
        env:
          MULTIFLEET_NODE_ID: ci-runner
          FLEET_NERVE_HMAC_KEY: ci-test-key-not-real

      - name: Run security tests
        run: |
          python -m pytest tests/ -m "security" -v --tb=short
        env:
          MULTIFLEET_NODE_ID: ci-runner
          FLEET_NERVE_HMAC_KEY: ci-test-key-not-real

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        continue-on-error: true
        run: |
          ruff check . --config ruff.toml

      - name: Ruff format check
        continue-on-error: true
        run: |
          ruff format --check . --config ruff.toml
