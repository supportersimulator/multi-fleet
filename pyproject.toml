[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multifleet"
version = "2.0.0"
description = "Multi-machine fleet coordination for Claude Code sessions via NATS pub/sub"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Aaron Tjomsland" },
]
keywords = ["claude", "fleet", "nats", "mcp", "coordination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "nats-py>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
fleet-nerve-mcp = "multifleet.mcp:main"
fleet-nerve = "multifleet.nats_client:main"

[project.urls]
Homepage = "https://github.com/<user>/multifleet"
Repository = "https://github.com/<user>/multifleet"

[tool.hatch.build.targets.wheel]
packages = ["multifleet"]
